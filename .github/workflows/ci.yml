name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required template files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            ABOUT.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            ROADMAP.md
            IMPLEMENTATION-CHECKLIST.md
            CODEOWNERS
            .github/PULL_REQUEST_TEMPLATE.md
            .github/dependabot.yml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

  local-oidc-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate realm import JSON
        run: python3 -m json.tool infra/dev/keycloak/zeaz-dev-realm.json >/dev/null

      - name: Generate and mask ephemeral local credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_password"
          printf 'ZIDP_DB_PASSWORD=%s\n' "$db_password" >> "$GITHUB_ENV"
          printf 'ZIDP_ADMIN_USERNAME=%s\n' "ci-local-admin" >> "$GITHUB_ENV"
          printf 'ZIDP_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
          printf 'ZIDP_BASE_URL=%s\n' "http://127.0.0.1:8080" >> "$GITHUB_ENV"
          printf 'ZIDP_REALM=%s\n' "zeaz-dev" >> "$GITHUB_ENV"
          unset db_password admin_password

      - name: Verify local OIDC requests bypass environment proxies
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Compose configuration
        run: docker compose --project-directory . -f infra/dev/docker-compose.yml config --quiet

      - name: Start isolated Keycloak and PostgreSQL
        run: docker compose --project-directory . -f infra/dev/docker-compose.yml up -d --wait --wait-timeout 240

      - name: Verify OIDC discovery, JWKS, PKCE and negative grants
        run: python3 scripts/test-idp-dev.py

      - name: Capture Keycloak startup logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose --project-directory . -f infra/dev/docker-compose.yml logs --no-color --timestamps --tail=200 keycloak || true

      - name: Remove ephemeral runtime and database volume
        if: always() && steps.credentials.outcome == 'success'
        run: docker compose --project-directory . -f infra/dev/docker-compose.yml down --volumes --remove-orphans
